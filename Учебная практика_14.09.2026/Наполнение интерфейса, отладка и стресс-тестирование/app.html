<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM: Список партнеров и скидок</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #1a1a1a;
        }

        header {
            background-color: #6c3fc5;
            padding: 18px 24px;
        }

        header h1 {
            color: #ffffff;
            font-size: 20px;
            font-weight: bold;
        }

        .container {
            max-width: 750px;
            margin: 20px auto;
            padding: 0 16px;
        }

        .card {
            background-color: #ffffff;
            border: 1px solid #d0d0d0;
            border-radius: 4px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-left {
            flex: 1;
        }

        .card-title {
            font-size: 14px;
            font-weight: bold;
            color: #1a1a1a;
            margin-bottom: 4px;
        }

        .card-info {
            font-size: 13px;
            color: #666666;
            line-height: 1.6;
        }

        .card-discount {
            font-size: 22px;
            font-weight: bold;
            color: #6c3fc5;
            margin-left: 24px;
            white-space: nowrap;
        }
    </style>
</head>
<body>

<header>
    <h1>CRM: Список партнеров и скидок</h1>
</header>

<div class="container">

    <div class="card">
        <div class="card-left">
            <div class="card-title">ООО | ООО "Логистик-Экспресс"</div>
            <div class="card-info">
                Не указан<br>
                +7 (999) 111-22-33<br>
                Рейтинг: 5
            </div>
        </div>
        <div class="card-discount">0%</div>
    </div>

    <div class="card">
        <div class="card-left">
            <div class="card-title">ИП | ИП Петров А.В.</div>
            <div class="card-info">
                Не указан<br>
                Не указан<br>
                Рейтинг: 4
            </div>
        </div>
        <div class="card-discount">0%</div>
    </div>

    <div class="card">
        <div class="card-left">
            <div class="card-title">ТК | ТК "Быстрый Путь"</div>
            <div class="card-info">
                Не указан<br>
                +78125554433<br>
                Рейтинг: 0
            </div>
        </div>
        <div class="card-discount">0%</div>
    </div>

    <div class="card">
        <div class="card-left">
            <div class="card-title">ООО | ООО "Новый Партнёр"</div>
            <div class="card-info">
                Иванов И.И.<br>
                +7 (900) 000-00-00<br>
                Рейтинг: 0
            </div>
        </div>
        <div class="card-discount">0%</div>
    </div>

</div>

</body>
</html>
